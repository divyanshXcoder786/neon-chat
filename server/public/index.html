<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>⚡ NeonChat — Real-Time</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #050510;
      --panel:    #0a0a1f;
      --border:   #1a1a4a;
      --neon1:    #00f5ff;  
      --neon2:    #ff00cc;   
      --neon3:    #aaff00;   
      --gold:     #ffd700;
      --text:     #c8d8ff;
      --muted:    #4a5580;
      --radius:   6px;
      --glow1:    0 0 8px var(--neon1), 0 0 20px var(--neon1);
      --glow2:    0 0 8px var(--neon2), 0 0 20px var(--neon2);
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Share Tech Mono', monospace;
      overflow: hidden;
    }
    body::before {
      content: "";
      position: fixed; inset: 0;
      background:
        repeating-linear-gradient(
          0deg,
          transparent,
          transparent 2px,
          rgba(0,245,255,0.03) 2px,
          rgba(0,245,255,0.03) 4px
        );
      pointer-events: none;
      z-index: 1000;
    }
    #loginScreen {
      position: fixed; inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      background: var(--bg);
      z-index: 500;
      transition: opacity .4s, transform .4s;
    }

    #loginScreen.hidden {
      opacity: 0;
      pointer-events: none;
      transform: scale(1.04);
    }

    .login-logo {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(2rem, 6vw, 3.5rem);
      font-weight: 900;
      letter-spacing: .15em;
      color: var(--neon1);
      text-shadow: var(--glow1);
      animation: flicker 4s infinite;
    }

    .login-logo span { color: var(--neon2); text-shadow: var(--glow2); }

    .login-sub {
      font-size: .8rem;
      color: var(--muted);
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    .login-box {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: min(340px, 90vw);
      padding: 32px;
      border: 1px solid var(--neon1);
      border-radius: var(--radius);
      background: rgba(0,245,255,.04);
      box-shadow: var(--glow1), inset 0 0 30px rgba(0,245,255,.03);
    }

    .login-box label {
      font-size: .7rem;
      letter-spacing: .15em;
      color: var(--neon1);
      text-transform: uppercase;
    }

    .login-box input {
      background: rgba(0,0,0,.6);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: inherit;
      font-size: 1rem;
      padding: 10px 14px;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
      width: 100%;
    }

    .login-box input:focus {
      border-color: var(--neon1);
      box-shadow: var(--glow1);
    }

    .btn-enter {
      padding: 12px;
      background: transparent;
      border: 2px solid var(--neon2);
      border-radius: var(--radius);
      color: var(--neon2);
      font-family: 'Orbitron', sans-serif;
      font-size: .85rem;
      font-weight: 700;
      letter-spacing: .2em;
      text-transform: uppercase;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: color .2s, box-shadow .2s;
    }

    .btn-enter::before {
      content: "";
      position: absolute; inset: 0;
      background: var(--neon2);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform .25s ease;
      z-index: -1;
    }

    .btn-enter:hover { color: var(--bg); box-shadow: var(--glow2); }
    .btn-enter:hover::before { transform: scaleX(1); }
    #app {
      display: none;
      height: 100%;
      grid-template-rows: auto 1fr auto;
      grid-template-columns: 220px 1fr;
      grid-template-areas:
        "header header"
        "sidebar messages"
        "sidebar composer";
    }

    #app.visible { display: grid; }
    header {
      grid-area: header;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
    }

    .header-logo {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.2rem;
      font-weight: 900;
      color: var(--neon1);
      text-shadow: var(--glow1);
      letter-spacing: .1em;
    }

    .header-logo span { color: var(--neon2); }

    .header-tag {
      font-size: .65rem;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .header-right { margin-left: auto; display: flex; align-items: center; gap: 16px; }

    #statusDot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--neon3);
      box-shadow: 0 0 6px var(--neon3);
      animation: pulse 2s infinite;
    }

    #statusDot.disconnected { background: var(--neon2); box-shadow: 0 0 6px var(--neon2); }

    #onlineCount {
      font-size: .75rem;
      color: var(--neon3);
    }

    .btn-leave {
      padding: 6px 14px;
      background: transparent;
      border: 1px solid var(--neon2);
      border-radius: var(--radius);
      color: var(--neon2);
      font-family: inherit;
      font-size: .7rem;
      letter-spacing: .1em;
      cursor: pointer;
      transition: background .2s, color .2s;
    }

    .btn-leave:hover { background: var(--neon2); color: var(--bg); }
    aside {
      grid-area: sidebar;
      border-right: 1px solid var(--border);
      background: var(--panel);
      padding: 16px 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .sidebar-title {
      font-size: .65rem;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--muted);
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    #userList { display: flex; flex-direction: column; gap: 6px; }

    .user-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 8px;
      border-radius: var(--radius);
      font-size: .8rem;
      animation: slideIn .3s ease;
    }

    .user-avatar {
      width: 28px; height: 28px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: .75rem;
      font-weight: 700;
      flex-shrink: 0;
    }

    .user-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .user-you { font-size: .6rem; color: var(--gold); }
    #messagesPanel {
      grid-area: messages;
      overflow-y: auto;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
    }
    #messagesPanel::-webkit-scrollbar { width: 4px; }
    #messagesPanel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .msg-system {
      align-self: center;
      font-size: .72rem;
      letter-spacing: .1em;
      color: var(--muted);
      padding: 4px 14px;
      border: 1px solid var(--border);
      border-radius: 20px;
      animation: fadeIn .4s ease;
    }

    .msg-system b { color: var(--neon3); }

    .msg-row {
      display: flex;
      gap: 12px;
      animation: fadeUp .35s ease;
    }

    .msg-row.own { flex-direction: row-reverse; }

    .msg-avatar {
      width: 36px; height: 36px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: .85rem;
      font-weight: 700;
    }

    .msg-content { max-width: 70%; display: flex; flex-direction: column; gap: 4px; }
    .msg-row.own .msg-content { align-items: flex-end; }

    .msg-meta {
      font-size: .65rem;
      color: var(--muted);
      display: flex; gap: 8px; align-items: baseline;
    }

    .msg-meta .name { letter-spacing: .05em; }
    .msg-meta .time { opacity: .7; }

    .msg-bubble {
      padding: 10px 16px;
      border-radius: 2px 14px 14px 14px;
      font-size: .9rem;
      line-height: 1.5;
      word-break: break-word;
      position: relative;
    }

    .msg-row.own .msg-bubble {
      border-radius: 14px 2px 14px 14px;
    }
    #composer {
      grid-area: composer;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 24px;
      border-top: 1px solid var(--border);
      background: var(--panel);
    }

    #msgInput {
      flex: 1;
      background: rgba(0,0,0,.5);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: inherit;
      font-size: .95rem;
      padding: 10px 16px;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }

    #msgInput:focus {
      border-color: var(--neon1);
      box-shadow: var(--glow1);
    }

    #msgInput::placeholder { color: var(--muted); }

    .btn-send {
      padding: 10px 22px;
      background: var(--neon1);
      border: none;
      border-radius: var(--radius);
      color: var(--bg);
      font-family: 'Orbitron', sans-serif;
      font-size: .75rem;
      font-weight: 700;
      letter-spacing: .1em;
      cursor: pointer;
      box-shadow: var(--glow1);
      transition: transform .1s, box-shadow .2s;
    }

    .btn-send:hover { transform: scale(1.04); }
    .btn-send:active { transform: scale(.97); }
    .btn-send:disabled { opacity: .4; cursor: not-allowed; transform: none; }
    #typingBar {
      grid-column: 2;
      padding: 4px 24px;
      font-size: .7rem;
      color: var(--muted);
      min-height: 20px;
      letter-spacing: .05em;
    }
    @keyframes flicker {
      0%,100% { opacity: 1; }
      92%      { opacity: 1; }
      93%      { opacity: .4; }
      94%      { opacity: 1; }
      96%      { opacity: .6; }
      97%      { opacity: 1; }
    }

    @keyframes pulse {
      0%,100% { opacity: 1; transform: scale(1); }
      50%     { opacity: .5; transform: scale(.8); }
    }

    @keyframes fadeIn  { from { opacity:0; }              to { opacity:1; } }
    @keyframes fadeUp  { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
    @keyframes slideIn { from { opacity:0; transform:translateX(-10px); } to { opacity:1; transform:translateX(0); } }
    @media (max-width: 600px) {
      #app.visible { grid-template-columns: 1fr; grid-template-areas: "header" "messages" "typing" "composer"; }
      aside { display: none; }
    }
  </style>
</head>
<body>
<div id="loginScreen">
  <div class="login-logo">NEON<span>CHAT</span></div>
  <div class="login-sub">⚡ Real-Time · WebSocket · Go Backend</div>

  <div class="login-box">
    <label for="usernameInput">Your Handle</label>
    <input id="usernameInput" type="text" maxlength="20"
           placeholder="e.g.Divyansh_dev" autocomplete="off" />
    <button class="btn-enter" onclick="enterChat()">ENTER CHATROOM</button>
  </div>
</div>
<div id="app">
  <header>
    <div class="header-logo">NEON<span>CHAT</span></div>
    <div class="header-tag">// secure channel</div>
    <div class="header-right">
      <div id="statusDot" class="disconnected"></div>
      <div id="onlineCount">0 online</div>
      <button class="btn-leave" onclick="leaveChat()">DISCONNECT</button>
    </div>
  </header>
  <aside>
    <div class="sidebar-title">// active users</div>
    <div id="userList"></div>
  </aside>
  <div id="messagesPanel"></div>
  <div id="typingBar"></div>
  <div id="composer">
    <input id="msgInput" type="text" maxlength="400"
           placeholder="Ping the void…" autocomplete="off"
           onkeydown="handleKey(event)" oninput="handleTyping()" />
    <button class="btn-send" id="sendBtn" onclick="sendMessage()">SEND ▶</button>
  </div>
</div>
<script>
const WS_URL =
  location.protocol === "https:"
    ? `wss://${location.host}/ws`
    : `ws://${location.host}/ws`;

const PALETTE = ["#00f5ff","#ff00cc","#aaff00","#ffd700","#ff6b35","#c77dff","#00b4d8","#f72585"];

let ws = null;
let myUsername = "";
let myId = "";
let onlineUsers = new Map();
let typingUsers = new Set();

/* ---------- helpers ---------- */
function colorFor(id) {
  let h = 0;
  for (let i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) >>> 0;
  return PALETTE[h % PALETTE.length];
}

function initials(name) {
  return name.slice(0, 2).toUpperCase();
}

function esc(str) {
  return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
document.getElementById("usernameInput").addEventListener("keydown", e => {
  if (e.key === "Enter") enterChat();
});

function enterChat() {
  const raw = document.getElementById("usernameInput").value.trim();
  if (!raw) return alert("Please enter username");

  myUsername = raw;

  document.getElementById("loginScreen").classList.add("hidden");
  document.getElementById("app").classList.add("visible");

  connectWS();
}

function leaveChat() {
  if (ws) ws.close();
  document.getElementById("app").classList.remove("visible");
  document.getElementById("loginScreen").classList.remove("hidden");
  document.getElementById("messagesPanel").innerHTML = "";
  document.getElementById("userList").innerHTML = "";
  onlineUsers.clear();
}
function connectWS() {
  const url = `${WS_URL}?username=${encodeURIComponent(myUsername)}`;
  ws = new WebSocket(url);

  ws.onopen = () => {
    document.getElementById("statusDot").classList.remove("disconnected");
  };

  ws.onclose = () => {
    document.getElementById("statusDot").classList.add("disconnected");
    addSystemMsg("⚡ Connection lost. Reconnecting...");
    setTimeout(connectWS, 3000);
  };

  ws.onerror = () => {
    addSystemMsg("⛔ WebSocket error");
  };

  ws.onmessage = (e) => {
    let msg;
    try { msg = JSON.parse(e.data); } catch { return; }
    handleMessage(msg);
  };
}
function handleMessage(msg) {

  if (msg.userCount !== undefined) {
    document.getElementById("onlineCount").textContent = `${msg.userCount} online`;
  }

  if (msg.type === "system") {
    addSystemMsg(msg.content);
    return;
  }

  if (msg.type === "typing") {
    showTyping(msg.sender, msg.senderId);
    return;
  }

  if (!myId && msg.sender === myUsername) myId = msg.senderId;

  registerUser(msg.senderId, msg.sender);
  addChatMsg(msg);
}
function registerUser(id, name) {
  if (!id || onlineUsers.has(id)) return;
  onlineUsers.set(id, { name, color: colorFor(id) });
  renderUserList();
}

function renderUserList() {
  const list = document.getElementById("userList");
  list.innerHTML = "";

  for (const [id, u] of onlineUsers) {
    const isYou = (id === myId || u.name === myUsername);

    const div = document.createElement("div");
    div.className = "user-item";
    div.innerHTML = `
      <div class="user-avatar" style="background:${u.color}22;color:${u.color};border:1px solid ${u.color}44">
        ${initials(u.name)}
      </div>
      <span class="user-name">${esc(u.name)}</span>
      ${isYou ? '<span class="user-you">YOU</span>' : ""}
    `;
    list.appendChild(div);
  }
}
function addChatMsg(msg) {
  const panel = document.getElementById("messagesPanel");
  const isOwn = (msg.senderId === myId || msg.sender === myUsername);
  const color = colorFor(msg.senderId || msg.sender);

  const row = document.createElement("div");
  row.className = "msg-row" + (isOwn ? " own" : "");
  row.innerHTML = `
    <div class="msg-avatar" style="background:${color}22;color:${color};border:1px solid ${color}44">
      ${initials(msg.sender)}
    </div>
    <div class="msg-content">
      <div class="msg-meta">
        <span class="name" style="color:${color}">${esc(msg.sender)}</span>
        <span class="time">${msg.timestamp || ""}</span>
      </div>
      <div class="msg-bubble">
        ${esc(msg.content)}
      </div>
    </div>
  `;

  panel.appendChild(row);
  scrollBottom();
}

function addSystemMsg(text) {
  const panel = document.getElementById("messagesPanel");
  const el = document.createElement("div");
  el.className = "msg-system";
  el.textContent = text;
  panel.appendChild(el);
  scrollBottom();
}
function showTyping(name, id) {
  if (id === myId) return;

  typingUsers.add(name);
  renderTyping();

  setTimeout(() => {
    typingUsers.delete(name);
    renderTyping();
  }, 3000);
}

function renderTyping() {
  const bar = document.getElementById("typingBar");
  if (typingUsers.size === 0) return bar.textContent = "";

  bar.textContent = `✦ ${[...typingUsers].join(", ")} typing...`;
}
function sendMessage() {
  const input = document.getElementById("msgInput");
  const text = input.value.trim();

  if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;

  ws.send(JSON.stringify({ type: "chat", content: text }));
  input.value = "";
}

function handleKey(e) {
  if (e.key === "Enter") sendMessage();
}

function handleTyping() {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  ws.send(JSON.stringify({ type: "typing", content: "" }));
}
function scrollBottom() {
  const panel = document.getElementById("messagesPanel");
  panel.scrollTop = panel.scrollHeight;
}
</script>
</body>
</html>
